<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Ruang Tunggu - Sistem Antrian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        body {
            background-color: #f8f9fa;
            overflow: hidden; /* Hide scrollbars for TV display */
        }
        .display-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-bar {
            padding: 15px 30px;
            text-align: center;
            background-color: #fff4e6; /* Orange pastel yang sangat soft */
            color: #333333;
            border-bottom: 5px solid #d32f2f; /* Garis merah corporate SIG/Tonasa */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }
        
        .theme-pangkep { border-bottom-color: #72b988; } /* Aksen hijau soft untuk Pangkep */
        .theme-makassar { border-bottom-color: #e27575; } /* Aksen merah soft untuk Makassar */
        
        .main-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .number-box {
            font-size: 15vw;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 20px;
        }
        
        .name-box {
            font-size: 4vw;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="display-container">
        <div id="config-overlay" class="position-absolute top-0 start-0 w-100 h-100 bg-white d-flex align-items-center justify-content-center" style="z-index: 1000;">
            <div class="text-center">
                <h2>Pilih Layar Display</h2>
                <div class="mt-4">
                    <button class="btn btn-lg m-2 text-white" style="background-color: #72b988; border-color: #72b988;" onclick="setDisplay('P')">UTD Pangkep</button>
                    <button class="btn btn-lg m-2 text-white" style="background-color: #e27575; border-color: #e27575;" onclick="setDisplay('M')">PMI Makassar</button>
                </div>
            </div>
        </div>

        <div id="header-bar" class="header-bar d-flex justify-content-between align-items-center">
            <!-- Logo Kiri: SIG dan Semen Tonasa -->
            <div class="d-flex align-items-center">
                <img src="img/logo-sig.png" alt="SIG" height="60" class="me-4" onerror="this.src='https://via.placeholder.com/100x50?text=Logo+SIG'">
                <img src="img/logo-tonasa.png" alt="Semen Tonasa" height="65" onerror="this.src='https://via.placeholder.com/100x50?text=Semen+Tonasa'">
            </div>
            
            <div class="text-center">
                <h1 id="tv-title" class="m-0 fw-bold text-uppercase text-dark" style="letter-spacing: 1px;">Antrian Donor Darah</h1>
                <h5 id="tv-clock" class="text-muted m-0 mt-1 fw-bold">00:00:00</h5>
            </div>
            
            <!-- Logo Kanan: Medical Center & HUT 58 -->
            <div class="d-flex align-items-center">
                <img src="img/logo-medcenter.png" alt="Medical Center" height="65" class="me-4" onerror="this.src='https://via.placeholder.com/100x50?text=Med+Center'">
                <img src="img/logo-hut58.png" alt="HUT 58" height="65" onerror="this.src='https://via.placeholder.com/80x50?text=HUT+58'">
            </div>
        </div>

        <div class="container-fluid flex-grow-1 d-flex p-0" style="height: calc(100vh - 180px);">
            <div class="row w-100 m-0">
                <!-- Bagian Kiri: Sedang Dilayani (Multi) -->
                <div class="col-8 d-flex flex-column bg-white p-4">
                    <h3 class="text-center fw-bold mb-4" id="tv-active-title" style="color: #618eb8;">SEDANG DILAYANI</h3>
                    <div id="tv-active-grid" class="row g-4 flex-grow-1 align-content-center justify-content-center text-center">
                        <div class="col-12 text-muted">
                            <h1 class="display-1 fw-bold mt-5">--</h1>
                            <h3 class="name-box">Silakan Menunggu</h3>
                        </div>
                    </div>
                </div>

                <!-- Bagian Kanan: Daftar Menunggu Berjalan (Naik) -->
                <div class="col-4 d-flex flex-column bg-light border-start p-4 shadow-sm">
                    <h4 class="text-center fw-bold text-secondary border-bottom pb-3 mb-0">Daftar Menunggu</h4>
                    <div class="flex-grow-1 pt-3" style="overflow: hidden;">
                        <marquee id="tv-waiting-list" direction="up" behavior="scroll" scrollamount="4" height="100%" class="text-center fs-4 fw-bold text-dark">
                            <div class="py-2 text-muted fw-normal">Belum ada antrian...</div>
                        </marquee>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-secondary text-white p-3 text-center marquee-container">
            <marquee id="tv-marquee" behavior="scroll" direction="left" class="fs-4">
                Terima kasih atas partisipasi Anda dalam mendonorkan darah. Setetes darah Anda, nyawa bagi mereka.
            </marquee>
        </div>
    </div>

    <!-- Hidden audio element to trick some browser autoplay policies, though interaction might still be needed -->
    <button id="btn-init-audio" class="btn btn-secondary position-absolute bottom-0 start-0 m-3" style="opacity: 0.1; z-index: 999;">Init Audio</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/display.js"></script>
</body>
</html>
