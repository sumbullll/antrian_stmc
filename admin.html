<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Sistem Antrian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Dashboard Admin Donor Darah</a>
            <div class="d-flex text-white align-items-center">
                <span class="me-3">Tim Bertugas: <strong id="admin-tim-display">--</strong></span>
                <select id="login-tim" class="form-select form-select-sm" style="width: auto;">
                    <option value="P">Pangkep (P)</option>
                    <option value="M">Makassar (M)</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Left Column: Current Serving & Actions -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Antrian Saat Ini</h5>
                    </div>
                    <div class="card-body text-center d-flex flex-column justify-content-center">
                        <h1 class="display-1 fw-bold" id="admin-current-nomor">--</h1>
                        <h3 class="text-muted" id="admin-current-nama">Tidak ada antrian aktif</h3>
                        
                        <div class="mt-4">
                            <button id="btn-selesai" class="btn btn-success btn-lg me-2" disabled>Selesai</button>
                            <button id="btn-lewat" class="btn btn-warning btn-lg" disabled>Lewati (Skip)</button>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button id="btn-panggil-selanjutnya" class="btn btn-primary btn-lg w-100">Panggil Selanjutnya</button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Queue List & Manual Input -->
            <div class="col-md-6 mb-4">
                <!-- Manual Input -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-secondary text-white">
                        <h6 class="card-title mb-0">Input Manual Darurat</h6>
                    </div>
                    <div class="card-body">
                        <form id="form-manual">
                            <div class="input-group">
                                <input type="text" id="manual_nama" class="form-control" placeholder="Nama Pendonor" required>
                                <button class="btn btn-outline-secondary" type="submit">Tambah ke Antrian</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Queue List -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                        <h6 class="card-title mb-0">Daftar Menunggu</h6>
                        <span class="badge bg-light text-dark" id="admin-queue-count">0</span>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="admin-queue-list">
                            <!-- List items will be populated by JS -->
                            <li class="list-group-item text-center text-muted">Belum ada antrian.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
